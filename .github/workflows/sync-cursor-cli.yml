name: Sync cursor-cli

on:
  schedule:
    # Every 6 hours. Downloads Linux packages only when the macOS cask version changed.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cursor-cli
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Sync version from the macOS cask
        id: sync
        run: python3 scripts/sync-cursor-cli.py

      - name: Commit and push
        if: steps.sync.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cursor-cli.rb
          git commit -m "Update cursor-cli to ${{ steps.sync.outputs.version }}"
          git push
